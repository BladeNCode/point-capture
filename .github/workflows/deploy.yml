name: Deploy to GitHub Pages

# Runs only after CI passes. Before that gate existed a red suite could ship —
# and in fact this workflow could not have succeeded at all: it ran
# `node utils/build.js` with no `npm ci`, and build.js imports esbuild.
#
# Serves at https://bladencode.github.io/point-capture/ — BASE_PATH is derived
# from the repo name below, so nothing here hardcodes that URL.

on:
  push:
    branches: [main]
  # Manual redeploy, without needing a commit. Added after a deploy failed on
  # "Found 0 artifact(s)" — upload-pages-artifact reported success but
  # deploy-pages could not see it yet. Do NOT fix that by re-running the failed
  # job: the first attempt's upload does eventually land, so a re-run adds a
  # SECOND artifact named github-pages and the run then fails permanently on
  # "Multiple artifacts ... Artifact count is 2". A fresh run gets a clean
  # artifact slate, which is what this trigger is for.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Reuses the gate rather than duplicating its steps.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # PINNED, not ubuntu-latest. ubuntu-latest became Ubuntu 26.04, which
    # Playwright 1.60.0 cannot install browsers for — CI's first real run died
    # on "Playwright does not support chromium on ubuntu26.04-x64".
    #
    # The obvious fix, upgrading Playwright, is closed to us: 1.65.1 supports
    # 26.04 but has DROPPED macOS 13, which is the development machine. So the
    # version that fixes CI is the version that cannot run locally, and a
    # matching local/CI pair only exists on an older OS. Hence the pin on both
    # sides: @playwright/test is held at exactly 1.60.0 (not a caret range)
    # and the runner is held at the newest Ubuntu that version supports.
    #
    # Revisit when the dev machine moves past macOS 13, not before. Bumping
    # either half alone breaks the other.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # app/shared is a submodule; without this the bundle cannot resolve
          # a single shared component.
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: node utils/build.js
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
        id: deployment
