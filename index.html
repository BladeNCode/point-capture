<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)" />
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <title>Point Capture</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" />
    <link rel="stylesheet" href="_lib/core/styles/tokens.css" />
    <style>
      /* ============================================================
         POINT ASSAUT THEME — "Steel & White"
         Overrides tokens.css here, not in _lib/ (survives `npx socle
         update` — see planning doc 09 §5 / CLAUDE.md's "never edit _lib
         directly"). Cascade order alone makes these win: this <style>
         loads after tokens.css's <link>, same selectors, same specificity.

         Base: fencing whites + blade-steel greys, cool and clinical,
         deliberately desaturated/monochrome rather than a saturated brand
         color. Accent: a single sharp steel-blue. New --color-side-a/-b
         tokens (not in core tokens.css) mirror the real scoring
         apparatus's green/red lamps — used wherever side A vs B needs to
         be visually distinct (score display, touch log), not just as
         decoration.
         ============================================================ */
      :root {
        --color-bg:             #F7F8F9;
        --color-surface:        #FFFFFF;
        --color-surface-raised: #ECEEF0;
        --color-border:         #DADEE2;

        --color-text-primary:   #1A1D21;
        --color-text-secondary: #6B7280;
        --color-text-muted:     #9198A1;

        --color-accent:         #52708A;
        --color-accent-light:   #E9EEF2;
        --color-accent-dark:    #3C5468;
        --color-accent-subtle:  rgba(82, 112, 138, 0.10);
        /* Deliberately theme-invariant, unlike --color-text-inverse (which
           flips with the surface it's designed to pair with, e.g.
           --color-action-dark). --color-accent itself doesn't flip between
           themes, so its "on" text shouldn't either — always white here. */
        --color-on-accent:      #FFFFFF;

        --color-side-a:         #1FA463;
        --color-side-a-light:   #E4F7EC;
        --color-side-b:         #E5382F;
        --color-side-b-light:   #FDEAE9;

        /* Full-bleed Capture "field" colors. Deliberately theme-invariant
           (like --color-on-accent): the scoring field stands in for the
           physical scoring apparatus, which doesn't change color because
           the phone switched to dark mode. Always deep enough for white
           --color-field-ink to clear WCAG AA on top. */
        --color-side-a-field:     #1F6A4C;
        --color-side-a-field-end: #164A36;
        --color-side-b-field:     #8A2C27;
        --color-side-b-field-end: #611C19;
        /* Halted band: near-black. Deliberately darker than the running
           flood so the two states separate on value and saturation, not
           hue alone — the earlier steel blue failed because it was another
           desaturated cool dark, i.e. a neighbour of this band. */
        --color-clock-field:      #14171A;
        --color-clock-field-end:  #0B0D0F;
        --color-field-ink:        #FFFFFF;

        /* Clock-running flood. While the clock runs this one colour takes
           over the whole screen — both fencer halves and the clock band —
           so "is time on?" is answerable from across the piste without
           reading anything. Violet because every other candidate is
           spoken for: green and red are the fencers, yellow/red/black are
           cards. Nothing in fencing is purple, so it carries no competing
           meaning. White clears 8.5:1 on it. Layout never changes between
           states; only colour carries the mode. */
        --color-clock-active:     #5B32A8;
        --color-clock-active-end: #3B1F73;

        /* Fencer identity while the flood is up. The normal side colours
           don't survive violet — #E5382F lands at 2.7:1, failing AA for
           label-sized text — so these are the lightened variants, both
           measured at 4.5:1+ against --color-clock-active. */
        --color-side-a-on-active: #3DD68C;
        --color-side-b-on-active: #FFB3AD;

        /* Score tints while running. Separate from the label tints above
           because the two have different contrast floors: the name is
           label-sized (needs 4.5:1) while the score is ~72px, i.e. large
           text (needs 3:1). Green is the most luminous hue at equal
           lightness, so at the label's green the score read brighter than
           B's — this one is muted and darkened to sit level with it, which
           only the larger text size has the headroom for. */
        --color-side-a-score-active: #63B391;  /* 3.4:1 on the flood */
        --color-side-b-score-active: #FFB3AD;  /* unchanged — reads right already */
      }

      [data-theme="dark"] {
        --color-bg:             #17191C;
        --color-surface:        #212428;
        --color-surface-raised: #2B2F34;
        --color-border:         #383D43;

        --color-text-primary:   #F2F3F5;
        --color-text-secondary: #9BA1AA;
        --color-text-muted:     #6E747C;

        --color-accent:         #52708A;
        --color-accent-light:   #1C2A34;
        --color-accent-dark:    #8AB0CC;
        --color-accent-subtle:  rgba(110, 147, 176, 0.18);

        --color-side-a:         #3DD68C;
        --color-side-a-light:   #0E2A1D;
        --color-side-b:         #FF564C;
        --color-side-b-light:   #341210;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        /* Stop the browser's pull-to-refresh. A downward swipe near the top
           of the capture screen is a normal gesture here (closing the log
           deck), and having it reload the page mid-bout is unacceptable —
           the fix belongs on the scrolling root, not in a gesture handler. */
        overscroll-behavior-y: contain;
        background-color: var(--color-bg);
        background-image: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(82,112,138,0.06) 0%, transparent 70%);
        color: var(--color-text-primary);
        font-family: var(--font-family);
        font-size: var(--font-size-body);
        line-height: var(--line-height-normal);
        min-block-size: 100dvh;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <update-banner hidden></update-banner>
    <app-router></app-router>
    <script type="module" src="%%MAIN_JS%%"></script>
  </body>
</html>
